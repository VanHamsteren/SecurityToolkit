<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Security Toolkit</title>
        <link rel="stylesheet" href="brand.css" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body class="popup">
        <header class="popup-head">
            <img class="logo logo-light" src="img/logo-wide.png" alt="PaulRutten.nl" width="132" height="40" />
            <img class="logo logo-dark" src="img/logo-wide-white.png" alt="" width="132" height="40" />
            <span class="tool-name">Security Toolkit</span>
            <span class="version" id="version"></span>
        </header>

        <main class="popup-body">
            <section class="card">
                <div class="eyebrow">Scan queue</div>
                <div class="stats">
                    <div class="stat"><div class="n" id="totalCount">0</div><div class="l">Total</div></div>
                    <div class="stat"><div class="n" id="pendingCount">0</div><div class="l">Waiting</div></div>
                    <div class="stat"><div class="n" id="completedCount">0</div><div class="l">Done</div></div>
                </div>

                <div id="processingIndicator" class="status-line" hidden>
                    <span class="spinner" aria-hidden="true"></span> urlscan.io is scanning
                </div>

                <div id="queueActions" class="actions">
                    <button type="button" id="processQueue" class="btn primary" disabled>Scan the queue</button>
                    <button type="button" id="viewQueue" class="btn">Open the queue</button>
                    <button type="button" id="clearQueue" class="btn quiet danger-text" disabled>Clear all</button>
                </div>

                <p id="emptyState" class="empty" hidden>
                    The queue is empty. Right-click a link or selected text and choose Security Analysis, Add to queue.
                </p>
            </section>

            <section class="card">
                <div class="eyebrow">More</div>
                <div class="actions">
                    <button type="button" id="openQuickScans" class="btn">Recent analyses</button>
                    <button type="button" id="openSettings" class="btn">Settings</button>
                </div>
            </section>

            <a href="https://urlscan.io/user/quotas/" target="_blank" rel="noopener noreferrer" class="quota">View your urlscan.io quota</a>
        </main>

        <script src="busy.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
